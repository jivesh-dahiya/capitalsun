name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk capitalsun.apk

      - uses: actions/upload-artifact@v4
        with:
          name: capitalsun-apk
          path: capitalsun.apk

      - name: Publish as a stable-link release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Capitalsun Android (latest build)
          body: Auto-built from the latest push to main. Download capitalsun.apk and install it directly on an Android device (enable "install from unknown sources" if prompted).
          files: capitalsun.apk
